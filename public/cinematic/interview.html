<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getting to know you · Twin.me</title>
<script>document.documentElement.classList.add('js')</script>
<link rel="stylesheet" href="claura.css">
<style>
  .stage { position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .stage .bg { position:absolute; inset:0; z-index:0; }
  .stage .bg img { width:100%; height:100%; object-fit:cover; object-position:center 35%; }
  .stage .bg::after { content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(11,11,15,.72) 0%, rgba(11,11,15,.6) 45%, rgba(11,11,15,.8) 100%); }

  .topbar { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; gap:16px; padding:18px 28px; }
  .topbar .m { font-family:var(--serif); font-size:20px; } .topbar .m em{font-style:italic;}
  .topbar .skip { margin-left:auto; font-size:12.5px; color:rgba(245,245,244,.7); cursor:pointer; }

  .progress { position:fixed; top:0; left:0; height:3px; z-index:21; background:linear-gradient(90deg,#c9a06a,#E8E0D4); width:43%; }

  .card { position:relative; z-index:2; width:min(640px,100%); margin:0 26px; padding:0; text-align:center; }
  .kick { font-family:var(--accent); font-weight:600; letter-spacing:.16em; text-transform:uppercase; font-size:11px; color:rgba(245,245,244,.66); }
  .q { font-family:var(--serif); font-size:clamp(32px,4.6vw,52px); line-height:1.08; color:#fff; margin-top:14px; text-shadow:0 2px 40px rgba(0,0,0,.5); }
  .qsub { font-family:var(--tag); letter-spacing:-.02em; font-size:17px; color:rgba(245,245,244,.82); margin-top:14px; }

  .opts { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:32px 0 0; text-align:left; }
  .opt { display:flex; align-items:center; gap:13px; padding:16px 18px; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid var(--border); backdrop-filter:blur(var(--blur)); transition:border-color .18s var(--ease), background .18s var(--ease); }
  .opt:hover { background:rgba(255,255,255,.10); }
  .opt.sel { border-color:rgba(232,224,212,.7); background:rgba(232,224,212,.12); box-shadow:inset 0 1px 0 var(--hi), 0 0 0 3px rgba(232,224,212,.12); }
  .opt .r { width:20px; height:20px; border-radius:50%; border:1.5px solid var(--border); flex-shrink:0; position:relative; }
  .opt.sel .r { border-color:var(--streak); } .opt.sel .r::after { content:""; position:absolute; inset:4px; border-radius:50%; background:var(--streak); }
  .opt .t { font-size:14.5px; }

  .own { display:flex; align-items:center; gap:12px; width:100%; margin-top:14px;
    background:rgba(255,255,255,.05); border:1px solid var(--border-soft); border-radius:12px; padding:13px 14px 13px 20px; }
  .own input { flex:1; background:transparent; border:0; outline:0; color:var(--text); font-family:var(--ui); font-size:14px; }
  .own input::placeholder { color:var(--text-ph); }

  .foot { display:flex; align-items:center; justify-content:center; gap:14px; margin-top:28px; }
  .learned { font-size:12.5px; color:rgba(245,245,244,.6); margin-top:26px; }
  .learned b { color:rgba(245,245,244,.85); font-weight:500; }

  @media (max-width:600px){ .opts { grid-template-columns:1fr; } }
</style>
</head>
<body>
  <div class="progress"></div>
  <div class="topbar"><span class="m">Twin.<em>me</em></span><span class="skip">Skip for now</span></div>

  <section class="stage">
    <div class="bg"><img src="assets/motion-portrait.png" alt=""></div>
    <div class="card">
      <div class="kick up">Getting to know you · 3 of 7</div>
      <h1 class="q up" style="animation-delay:.06s">When the day frays,<br>what do you reach for first?</h1>
      <p class="qsub up" style="animation-delay:.12s">No wrong answer — I'm learning how you find your footing.</p>

      <div class="opts up" style="animation-delay:.18s">
        <div class="opt sel"><span class="r"></span><span class="t">I build something</span></div>
        <div class="opt"><span class="r"></span><span class="t">I go quiet</span></div>
        <div class="opt"><span class="r"></span><span class="t">Music, loud</span></div>
        <div class="opt"><span class="r"></span><span class="t">Movement / air</span></div>
      </div>
      <div class="own up" style="animation-delay:.22s">
        <input placeholder="Or say it in your own words…">
      </div>

      <div class="foot up" style="animation-delay:.28s">
        <button class="btn btn-primary">Continue →</button>
      </div>
      <p class="learned up" style="animation-delay:.34s">So far you read as <b>curious</b>, <b>steady</b>, and happiest <b>mid-build</b>.</p>
    </div>
  </section>
  <script src="reveal.js" defer></script>
</body>
</html>
