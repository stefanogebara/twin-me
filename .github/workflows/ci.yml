name: CI

# Build + test gate for every PR and every push to main. This is the safety
# net the audit (2026-06) flagged as Milestone 0: nothing else (lint, types,
# security) is enforceable until there is a green pipeline to hang it on.
#
# What is a HARD gate today (proven green headless — see the two steps below):
#   - vite build
#   - full vitest suite, minus *.integration.test.js (those do a REAL Supabase
#     round-trip against the prod project and must not run on every push).
#
# What is INFORMATIONAL today (continue-on-error): eslint + tsc. There is a
# known lint/type backlog; these run for visibility and get promoted to hard
# gates once the baseline is triaged. Promoting them before that would make the
# gate permanently red and train everyone to ignore it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes in-flight runs — saves Actions minutes
# on rapid push sequences.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (vite)
        run: npm run build

      - name: Test (vitest, excl. live-DB integration tests)
        # Stub Supabase env so api/config/supabase.js does not throw at import
        # (it requires url + anon + service-role keys at module load). Real
        # round-trips live only in *.integration.test.js, which are excluded
        # here; every other test mocks the DB, so these stub values are never
        # actually dialed.
        #
        # --retry=2: transient-flake guard. The suite has a known load/order
        # flakiness (a few tests pass in isolation but can fail under full
        # parallelism — process.env bleed between files). Retry absorbs those
        # transients WITHOUT hiding real regressions: a consistently-broken test
        # still fails all 3 attempts. The root-cause fix (env isolation + a
        # bounded pool) is tracked separately; remove this once that lands.
        env:
          SUPABASE_URL: https://ci-stub.supabase.co
          SUPABASE_ANON_KEY: ci-stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-stub-service-role-key
        run: npx vitest run --retry=2 --exclude '**/*.integration.test.js'

      # ---- Coverage floor for the product (audit 2026-09-19, M0-1) ----
      # The money core and its pages, measured on their own: the floor in
      # vitest.money.config.ts can only rise. The legacy surface is not gated.
      - name: Money coverage floor
        env:
          SUPABASE_URL: https://ci-stub.supabase.co
          SUPABASE_ANON_KEY: ci-stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-stub-service-role-key
        run: npx vitest run --config vitest.money.config.ts --coverage

      # ---- Baseline-freeze gate (audit 2026-06 M0.5) ----
      # Replaces the old non-blocking lint+tsc steps. Runs eslint + tsc once and
      # counts errors plus route files with direct Supabase access (.from). These
      # counts may only stay flat or shrink — CI fails only on a REGRESSION above
      # the frozen baseline (scripts/ci/baselines.json), never on the existing
      # backlog. This is how lint/tsc get teeth without a big-bang cleanup.
      - name: Baseline freeze (eslint + tsc + direct-DB-in-routes)
        run: node scripts/ci/check-baselines.mjs

  money-persistence:
    name: Money persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twinme_money_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: money-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # The money pages are strict (M3-1, 2026-09-19): what a signed-in person sees first
      # is typed all the way, whatever the rest of the app still allows.
      - name: Money pages, strict types
        run: npx tsc -p tsconfig.money.json

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Real database invariants (no production secrets)
        env:
          MONEY_TEST_DATABASE_URL: postgresql://postgres:money-test-only@127.0.0.1:5432/twinme_money_test
          SUPABASE_URL: https://ci-stub.supabase.co
          SUPABASE_ANON_KEY: ci-stub-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-stub-service
        run: npx vitest run tests/api/services/money/persistence.integration.test.js

  money-browser:
    name: Money browser
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --config playwright.money.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: money-browser-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # The phone app was outside every check in this file, which is how a screen calling
  # endpoints deleted months earlier survived in the repo. It is the product's other half
  # now, so it gets typechecked. Its dependency tree is separate from the web's.
  mobile-typecheck:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Install shared test runner
        run: npm ci --legacy-peer-deps
      - name: Capture account lifecycle
        run: npx vitest run --config vitest.mobile.config.ts
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit -p tsconfig.json

  android-capture:
    name: Android capture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - name: Compile native capture and test delivery status handling
        working-directory: mobile/android
        run: bash gradlew :notification-listener:compileDebugKotlin :notification-listener:testDebugUnitTest --no-daemon

  smoke-e2e:
    name: Smoke E2E (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NON-BLOCKING for now: this reports a signal but must not fail the CI run
    # or block a PR while it proves out. `continue-on-error` keeps the overall
    # workflow green even if the smoke fails. Once it has a track record of
    # green, drop this line and add the job to branch protection to promote it
    # to a hard gate (same staged approach as the eslint/tsc baseline steps).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build (vite)
        run: npm run build

      # Boots the built app via `vite preview` (config's webServer) and runs the
      # backend-free smoke — no API server, Supabase, or auth needed.
      - name: Smoke — frontend boot + render
        run: npm run test:smoke:ci

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ci-report
          path: playwright-report/
          retention-days: 7
