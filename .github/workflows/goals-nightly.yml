name: Goals nightly

# Agentic OS, Phase 1 (plan: .claude/plans/2026-07-12-agentic-os/README.md).
# Reruns the feature canaries in tests/goals/ against main every night. The
# point is DRIFT detection: something shipped three weeks ago quietly breaking
# gets flagged with attribution ("what changed since last green"), instead of
# being discovered by a user.
#
# Report card: this workflow's run history is the Phase 1 report card — one
# pass/fail + sha per night. Phase 2 reads it via the Actions API to compute
# trailing-20 grades per task type.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC = 03:00 Sao Paulo
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  money-safety:
    name: Money safety canaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twinme_money_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: money-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Payment, tenant and delivery invariants
        env:
          MONEY_TEST_DATABASE_URL: postgresql://postgres:money-test-only@127.0.0.1:5432/twinme_money_test
          SUPABASE_URL: https://ci-stub.supabase.co
          SUPABASE_ANON_KEY: ci-stub-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-stub-service
        run: npx vitest run tests/api/services/money tests/api/routes/moneyInboxDelivery.test.js tests/api/routes/cronMoneyPull.test.js tests/frontend/moneyAccountCache.test.tsx
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --config playwright.money.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: money-safety-evidence
          path: test-results/
          retention-days: 30

  goals:
    name: Feature canaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for last-green attribution

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same Supabase stubs as ci.yml: service modules require these at import
      # time; goals tests never dial them.
      - name: Run goals suite
        env:
          SUPABASE_URL: https://ci-stub.supabase.co
          SUPABASE_ANON_KEY: ci-stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-stub-service-role-key
        run: >
          npx vitest run
          tests/goals
          tests/api/routes/whatsappZapiWebhookAuth.test.js

      # ---- Red path: attribute and notify -------------------------------
      # Finds the sha of the last successful nightly, diffs main since then,
      # and opens (or comments on) a single tracking issue. No repo mutation.
      - name: Attribute regression and open issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LAST_GREEN=$(gh api "repos/${REPO}/actions/workflows/goals-nightly.yml/runs?status=success&branch=main&per_page=1" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || echo "")
          if [ -n "$LAST_GREEN" ] && git cat-file -e "$LAST_GREEN" 2>/dev/null; then
            CHANGES=$(git log --oneline "${LAST_GREEN}..HEAD" | head -40)
            SINCE="since last green (${LAST_GREEN})"
          else
            CHANGES=$(git log --oneline --since="48 hours ago" | head -40)
            SINCE="in the last 48h (no prior green nightly found)"
          fi
          BODY=$(printf 'Nightly goals canaries went RED.\n\nRun: %s\n\nCommits %s:\n\n```\n%s\n```\n\nEach goal pins a user-facing invariant of a shipped feature — read the failing goal file header for what broke and why it matters.' \
            "$RUN_URL" "$SINCE" "${CHANGES:-none}")
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "Goals nightly RED in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "Goals nightly RED: shipped-feature canary regressed" --body "$BODY"
          fi

  # ---- Graded task types (agentic OS phase 2, slice 1; 2026-09-19) ---------------
  # Each job is a kind of work the report card grades by its last twenty nights.
  money-imports:
    name: Money loads a module at a time
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - env:
          SUPABASE_URL: https://ci-stub.supabase.co
          SUPABASE_ANON_KEY: ci-stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-stub-service-role-key
        run: npx vitest run tests/goals/money-imports.goal.test.js
  money-first:
    name: Money first, one instruction file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/goals/money-first.goal.test.js tests/goals/agents-in-sync.goal.test.js
      - run: npx tsc -p tsconfig.money.json
  money-canaries:
    name: Money canaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Today paints; one payment, one line; the day is written down; the loop is budgeted.
      - env:
          SUPABASE_URL: https://ci-stub.supabase.co
          SUPABASE_ANON_KEY: ci-stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-stub-service-role-key
        run: npx vitest run tests/frontend/moneyAccountCache.test.tsx tests/api/services/money/bankIdentity.test.js tests/api/routes/cronMoneyLearn.test.js tests/api/routes/cronMoneyPull.test.js tests/api/services/money/allowance.test.js
  # M0-2 (2026-09-19): the whole unit suite without the retry that hides its order flake. Ten
  # green nights here, graded by the report card, are the evidence for dropping --retry=2 in CI.
  unit-no-retry:
    name: Unit suite, no retries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - env:
          SUPABASE_URL: https://ci-stub.supabase.co
          SUPABASE_ANON_KEY: ci-stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-stub-service-role-key
        run: npx vitest run --retry=0 --exclude '**/*.integration.test.js'
  # M3-6 (2026-09-19): the money journey on production as a signed-in person. Runs only when
  # MONEY_CANARY_TOKEN is set (an access token for the canary account, minted by the owner);
  # without it the job succeeds with a note, so the report card stays honest about it.
  money-production:
    name: Money on production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: gate
        env:
          TOKEN: ${{ secrets.MONEY_CANARY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; echo "MONEY_CANARY_TOKEN is not set: the production canary did not run." >> "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.gate.outputs.has == 'true'
        run: npm ci
      - if: steps.gate.outputs.has == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.has == 'true'
        env:
          MONEY_CANARY_TOKEN: ${{ secrets.MONEY_CANARY_TOKEN }}
          MONEY_CANARY_URL: ${{ secrets.MONEY_CANARY_URL }}
        run: npx playwright test --config playwright.production.config.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: money-production-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 14
  report-card:
    name: Report card
    needs: [money-safety, goals, money-imports, money-first, money-canaries, unit-no-retry, money-production]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: "Grade every job by its last twenty nights (shadow: money is never automated)"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/money-report-card.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: report-card
          path: test-results/report-card.json
          retention-days: 90
